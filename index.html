<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171916">
  <meta name="description" content="Cava+ Orça — orçamentos inteligentes para construção.">
  <title>Cava+ Orça — Orçamentos inteligentes para construção</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" aria-label="Cava+ Orça início"><span class="brand-mark">C<span>+</span></span><span class="brand-name">CAVA<span>+</span><small>ORÇA</small></span></a>
    <div class="company-switch"><span class="company-avatar">C</span><span><b>Empresa</b><small>Workspace</small></span><span class="chevron">⌄</span></div>
    <div class="nav-label">ESPAÇO DE TRABALHO</div>
    <nav class="nav">
      <a href="#dashboard" data-page="dashboard" class="nav-link active"><span class="nav-icon">◫</span>Dashboard</a>
      <a href="#projetos" data-page="projetos" class="nav-link"><span class="nav-icon">⌂</span>Projetos</a>
      <a href="#orcamentos" data-page="orcamentos" class="nav-link"><span class="nav-icon">▤</span>Orçamentos</a>
      <a href="#composicoes" data-page="composicoes" class="nav-link"><span class="nav-icon">▦</span>Composições</a>
      <a href="#precos" data-page="precos" class="nav-link"><span class="nav-icon">◉</span>Banco de preços</a>
    </nav>
    <div class="sidebar-bottom"><a href="#configuracoes" data-page="configuracoes" class="nav-link"><span class="nav-icon">⚙</span>Configurações</a><div class="user-chip"><span class="user-avatar">MR</span><span><b>Conta</b><small>Usuário</small></span><button class="dots" onclick="logout()" title="Sair">↪</button></div><div class="sidebar-foot">Cava+ Orça <span>V1.1.2</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-button menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button><div class="breadcrumb">Empresa <span>/</span> <b id="crumb">Dashboard</b></div><div class="top-actions"><button class="icon-button" title="Ajuda">?</button><button class="icon-button notification" title="Notificações">♧<i></i></button><span class="top-avatar">US</span></div></header>
    <section class="page" id="app"></section>
    <footer class="app-footer"><span>© 2026 Cava+ Orça</span><span>Feito para construir melhor <b>◆</b></span></footer>
  </main>
  <div id="modalRoot"></div><div id="toast" class="toast" role="status"></div>
  <script>
    window.showCavaStartupError = function (message) {
      var app = document.getElementById('app');
      if (!app || app.textContent.trim()) return;
      app.innerHTML = '<div class="notice" role="alert"><strong>Não foi possível iniciar o Cava+ Orça.</strong><br>' + String(message || 'Confira o Console do navegador e recarregue a página.') + '</div>';
    };
    window.addEventListener('error', function (event) {
      if (event.target instanceof HTMLScriptElement || event instanceof ErrorEvent) {
        console.error('[CAVA+ ORÇA] falha de carregamento/inicialização', event.message || event.target.src);
        window.showCavaStartupError(event.message || 'Um arquivo JavaScript não carregou. Verifique o Network do navegador.');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      console.error('[CAVA+ ORÇA] erro de inicialização não tratado', event.reason);
      window.showCavaStartupError('Ocorreu um erro inesperado ao iniciar. Consulte o Console do navegador.');
    });
  </script>
  <script src="./calculations.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>console.info('[CAVA+ ORÇA] Supabase JS v2 carregado:', Boolean(window.supabase?.createClient));</script>
  <script src="./app.js"></script>
</body>
</html>
